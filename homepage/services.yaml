# URLs assume the tailscale serve mapping in serve.sh.
# Replace  once, after you know the node's MagicDNS name:
#   sed -i "s//$TAILNET_HOST/g" homepage/*.yaml
# `server` maps to an entry in docker.yaml for the status dots.

- Monitoring:
    - Beszel:
        href: https://__HOST__:8449
        description: Host metrics, disk health, alerts
        icon: si-beszel
        server: selfhost
        container: beszel
    - Uptime Kuma:
        href: https://__HOST__:8450
        description: Is it answering, and is the cert valid
        icon: si-uptimekuma
        server: selfhost
        container: uptime-kuma
    - ntfy:
        href: https://__HOST__:8448
        description: Notification bus
        icon: si-ntfy
        server: selfhost
        container: ntfy

- Apps:
